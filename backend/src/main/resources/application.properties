# ===== SkillBridge backend configuration =====
server.port=8080
spring.application.name=skillbridge-backend

# -- local MySQL Community database --
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/skillbridge?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
# password NOT stored here (public repo). Run the backend with your own:
#   DB_PASSWORD='your-mysql-password' mvn spring-boot:run
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -- file uploads (U6/F11) --
skillbridge.upload-dir=./uploads
skillbridge.max-file-size=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# -- security --
spring.jackson.default-property-inclusion=non_null

logging.level.org.springframework.security=INFO
